version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webisight
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      AUDIT_TIMEOUT_SECONDS: 30
      RATE_LIMIT_PER_MINUTE: 20
      MAX_RESPONSE_BYTES: 5242880
      CACHE_TTL_SECONDS: 300
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: false
    networks:
      - webisight-net

networks:
  webisight-net:
    driver: bridge
